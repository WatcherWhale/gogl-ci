stages:
  - release

release:rc:
  stage: release
  rules:
    - if: "$CI_COMMIT_BRANCH != null && $CI_COMMIT_BRANCH =~ /^prefix\/[0-9]+\\.[0-9]+\\.x$/"
      when: manual
      allow_failure: true
    - when: never
  script:
    - echo "release rc"

release:promote:
  stage: release
  rules:
    - if: "$CI_COMMIT_BRANCH != null && $CI_COMMIT_BRANCH =~ /^prefix\/[0-9]+\\.[0-9]+\\.x$/"
      when: manual
      allow_failure: true
    - when: never
  script:
    - echo "release promote"

release:tag:
  stage: release
  rules:
    - if: "$CI_COMMIT_TAG != null && $CI_COMMIT_TAG =~ /^prefix\/[0-9]+\\.[0-9]+\\.[0-9]+$/"
    - when: never
  script:
    - echo "release tag"
